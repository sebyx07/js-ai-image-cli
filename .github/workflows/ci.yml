name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # One group per pull request; every other run gets its own group, because a shared group
  # drops a queued run when a third one arrives, even with cancel-in-progress off.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      # The same two commands a developer runs: bin/setup installs the locked
      # dependencies, bin/check is the gate (lint, tests, typecheck + build).
      - name: Setup
        run: bin/setup

      - name: Gate
        run: bin/check
